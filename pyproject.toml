[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-trading-agents"
version = "5.0.0"
description = "Modular, regime-aware, multi-expert BTC trading research platform: feature engineering, dynamic structure, regime detection, expert routing, risk-aware execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "devansh1012007" }]
keywords = ["bitcoin", "trading", "lightgbm", "regime-detection", "walk-forward", "backtesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Keep in sync with requirements.txt (Docker installs from requirements.txt
# for layer caching; this list is the canonical dependency set).
dependencies = [
    # Core
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    # Data & exchange
    "ccxt>=3.0.0",
    "python-binance>=1.0.17",
    # ML & modeling
    "lightgbm>=4.0.0",
    "hmmlearn>=0.3.0",
    "scikit-learn>=1.3.0",
    # Backtesting
    "vectorbt>=0.25.0",
    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # Utilities
    "pydantic>=2.0.0",
    "structlog>=23.0.0",
    "pytest>=7.0.0",
    # TUI dashboard (Phase 5, M5.10)
    "textual>=0.80.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pytest-cov>=4.1.0",
]
demo = [
    "streamlit>=1.30.0",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast tests of a single component, no cross-layer wiring (auto-applied to tests/unit)",
    "integration: multi-layer wiring through the real pipeline code path (tests/integration)",
    "e2e: full-stack runs incl. backtest entrypoints (tests/e2e)",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# ruff  (lint + import sorting)
# NOTE: E501 deliberately ignored -- several long docstring lines predate the
# linter; fix opportunistically rather than in one noisy sweep.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "wheelhouse-BTC",
    "wheelhouse4BTC",
    ".venv",
    "data",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (common bug patterns)
]
# "UP" (pyupgrade) intentionally not enabled yet: adopting PEP 585/604 typing
# across ~6k lines is a mechanical churn best done as its own dedicated pass.
ignore = [
    "E501",  # line too long (see note above)
    "B008",  # function call in default arg (used by dataclass field defaults)
]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests insert the repo root into sys.path before importing `src`
# -- imports after code there are the deliberate bootstrap pattern.
"scripts/**" = ["E402"]
"tests/**" = ["E402", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---------------------------------------------------------------------------
# mypy  (gradual typing)
# Global config is lenient; src/state (contracts) and src/reporting are held
# to a stricter bar because everything downstream depends on their types.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["src.state.*", "src.reporting.*"]
disallow_untyped_defs = true
warn_return_any = true
