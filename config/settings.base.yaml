###############################################################################
# SYSTEM CONFIGURATION (Phase 3 §4)
###############################################################################
system:
  data_granularity: "1m"                # "10s", "30s", "1m", "5m" -- config only, no code change to switch
  exchange: "binance"
  sandbox: true
  symbol: "BTC/USDT"

###############################################################################
# DATA SOURCES & STORAGE
###############################################################################
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  logs_dir: "data/logs"
  lookback_bars: 100

###############################################################################
# FEATURE ENGINE (Phase 5: now actually wired to code. Periods are
# config-driven with period-agnostic field names: short/medium/long.
# Changing a period changes what that field computes — the name no longer
# lies about the horizon.)
###############################################################################
feature_engine:
  momentum_periods: {short: 1, medium: 5, long: 10}
  volatility_periods: {short: 1, medium: 5}
  rsi_period: 14
  sma_periods: [9, 21]
  volume_zscore_period: 20

###############################################################################
# MARKET THRESHOLDS (Phase 1, carried forward)
###############################################################################
market:
  min_spread_pct: 0.01
  max_spread_pct: 0.5
  min_depth_usdt: 10000

###############################################################################
# DYNAMIC STRUCTURE ENGINE (Phase 2, Module A -- §6)
###############################################################################
structure:
  lookback_bars: 50
  pivot_window: 5
  min_zone_separation_pct: 1.0
  zone_decay_bars: 100
  zone_label_horizon_bars: 20
  breakout_survival_penalty: 0.3

###############################################################################
# REGIME DETECTION (Phase 2, Module B -- §7)
###############################################################################
regime:
  n_states: 3               # trending_up / trending_down / chop_range; panic handled separately
  confidence_floor: 0.35
  persistence_window_bars: 20
  persistence_transition_threshold: 0.6
  panic_z_threshold: 3.0
  observation_features: [momentum_medium, momentum_long, volatility_medium, volatility_long, volume_zscore]

###############################################################################
# TRIPLE-BARRIER LABELING (Phase 3, §5)
###############################################################################
labeling:
  max_holding_bars: 5                   # Trade resolves in up to 5 bars (wall-clock scales with granularity)
  fee_pct: 0.04                         # Binance taker fee (adjust for your tier -- §15.1)
  slippage_buffer_pct: 0.02
  k_tp: 1.5                             # TP = 1.5 x volatility_30s
  k_sl: 1.0                             # SL = 1.0 x volatility_30s

  # Regime-specific barrier overrides (§9). Keyed by RegimeType member
  # NAME (e.g. TRENDING_UP), matching parse_regime_list's convention.
  regime_specific_barriers:
    TRENDING_UP:
      k_tp: 2.0
      k_sl: 0.8
    TRENDING_DOWN:
      k_tp: 2.0
      k_sl: 0.8
    CHOP_RANGE:
      k_tp: 1.0
      k_sl: 1.0
    PANIC_SPIKE:
      k_tp: 0.5
      k_sl: 0.5

###############################################################################
# EXPERT LAYER (Phase 3, §6)
###############################################################################
experts:

  trend:
    # Candidate gate
    momentum_threshold: 0.05
    momentum_period_bars: 5
    regime_requirement: [TRENDING_UP, TRENDING_DOWN]
    regime_confidence_floor: 0.4
    persistence_requirement: 0.5

    # Fallback (no model available, or granularity mismatch)
    fallback_confidence: 0.6
    fallback_expected_return: 0.08
    fallback_expected_risk: 0.12

    model_path: "data/models/experts/trend_expert.pkl"

  mean_reversion:
    # Candidate gate
    regime_requirement: [CHOP_RANGE]
    regime_confidence_floor: 0.35
    zone_proximity_pct: 0.3
    zone_strength_floor: 0.3
    rsi_extremity_threshold: [20, 80]

    # Fallback
    fallback_confidence: 0.55
    fallback_expected_return: 0.06
    fallback_expected_risk: 0.10

    model_path: "data/models/experts/mean_reversion_expert.pkl"

  breakout:
    # Candidate gate
    regime_requirement: [TRENDING_UP, TRENDING_DOWN]
    regime_confidence_floor: 0.35
    compression_lookback_bars: 20
    compression_pct_threshold: 10
    # Substitutes for the plan's raw-volume-ratio gate -- see
    # breakout_expert.py's module docstring for why.
    volume_zscore_surge_threshold: 1.0
    orderflow_momentum_threshold: 10

    # Fallback
    fallback_confidence: 0.50
    fallback_expected_return: 0.10
    fallback_expected_risk: 0.15

    model_path: "data/models/experts/breakout_expert.pkl"

###############################################################################
# OPPORTUNITY FILTER (Phase 3, §7)
###############################################################################
opportunity_filter:

  hard_rules:
    edge_vs_fees_threshold: 0.02
    max_spread_pct: 0.05
    min_depth_usdt: 10000
    volatility_floor_pct: 0.01
    volatility_ceiling_pct: 1.5
    reject_on_regime: [PANIC_SPIKE]
    no_consensus_ceiling: 0.7
    reject_if_best_confidence_below: 0.3

  ml_model:
    model_path: "data/models/opportunity_filter.pkl"
    blend_weight: 0.3                  # 30% model, 70% hard rules -- §15.7

  # Regime-specific overrides, layered on top of hard_rules above. Keyed
  # by RegimeType member NAME.
  regime_overrides:
    PANIC_SPIKE:
      edge_vs_fees_threshold: 0.05
    TRENDING_UP:
      volatility_ceiling_pct: 2.0
    TRENDING_DOWN:
      volatility_ceiling_pct: 2.0
    CHOP_RANGE:
      volatility_floor_pct: 0.005

###############################################################################
# ROUTER (Phase 3, §8)
###############################################################################
router:

  model:
    model_path: "data/models/router.pkl"
    blend_weight: 0.2                  # 20% model, 80% expert confidence initially -- §15.8

  fallback_behavior:
    confidence_floor_to_trade: 0.3

###############################################################################
# MODEL PATHS & SERVING
###############################################################################
models:
  # Zone survival (Phase 2) -- kept as `zone_model` (Phase 2's original key)
  # rather than the Phase 3 plan's `zone_survival_model`, since Phase 2's
  # code already reads `zone_model` throughout; renaming would silently
  # break already-working config loading for no benefit.
  zone_model: "data/models/zone_validity_model.pkl"
  zone_survival_blend_weight: 0.0

  regime_hmm: "data/models/regime_hmm.pkl"
  regime_classifier: "data/models/regime_classifier.pkl"
  regime_serving_source: "auto"        # "auto" | "hmm_filter" | "lgbm_classifier" | "rule_based"

  experts_dir: "data/models/experts/"

###############################################################################
# BACKTEST & TRAINING (walk-forward, shared across every Phase 2/3 script)
###############################################################################
backtest:
  train_bars: 5000
  test_bars: 500
  step_bars: 100
  embargo_bars: 50


###############################################################################
# LIQUIDITY (Phase 4, §4) -- resolves Finding #2
###############################################################################
liquidity:
  synthetic:
    base_spread_pct: 0.015
    k_volatility: 0.8
    k_illiquidity: 0.02
    min_volume_zscore_floor: 0.1
    k_depth: 3.0
    depth_participation_rate: 0.15
  real_order_book:
    depth_limit: 10

###############################################################################
# RISK LAYER (Phase 4, §5)
###############################################################################
risk:
  sizing:
    method: "fixed_fractional_risk"
    risk_pct_per_trade: 0.5
    max_position_pct_of_equity: 20.0

  hard_rules:
    min_invalidation_distance_pct: 0.1
    max_invalidation_distance_pct: 3.0
    min_bars_between_switches: 3
    liquidity_size_reduction_curve:
      thin_threshold_usdt: 20000
      full_size_threshold_usdt: 50000
    reject_on_regime: [PANIC_SPIKE]

  circuit_breakers:
    # Directly from Project_Plan.md's own stated requirements
    max_drawdown_pct: 8.0
    consecutive_execution_errors_halt: 3

    daily_loss_limit_pct: 2.0
    consecutive_losses_soft_pause: 3
    consecutive_losses_hard_halt: 6
    max_trades_per_hour: 10
    max_concurrent_positions: 1

    data_staleness_halt_seconds: 120

  ml_model:
    model_path: "data/models/risk_model.pkl"
    blend_weight: 0.25

###############################################################################
# EXECUTION LAYER (Phase 4, §6)
###############################################################################
execution:
  mode: "paper_sim"              # "paper_sim" | "paper_live" | "live" -- the one switch
  order_type: "limit"
  limit_timeout_bars: 2
  partial_fill_policy: "cancel_remainder"   # "cancel_remainder" | "market_fill_remainder"
  min_bars_between_orders: 2
  slippage_pct: 0.01
  confirm_real_money: false      # Second, separate flag from mode -- both required for live orders
  secrets:
    api_key_env_var: "BTC_BOT_API_KEY"
    api_secret_env_var: "BTC_BOT_API_SECRET"

###############################################################################
# MODEL REGISTRY & RETRAINING (Phase 4, §8)
###############################################################################
retraining:
  schedule: "0 3 * * *"          # Cron syntax, run via OS cron/systemd timer
  components: [zone_survival, regime_hmm, regime_classifier, trend_expert,
               mean_reversion_expert, breakout_expert, opportunity_filter, router, risk_model]
  promotion_margin_pct: 5.0
  min_validation_samples: 500

###############################################################################
# DRIFT & PERFORMANCE MONITORING (Phase 4, §9)
###############################################################################
monitoring:
  drift:
    psi_alert_threshold: 0.25
    check_schedule: "0 4 * * *"
  performance:
    expectancy_gap_alert_threshold_pct: 30.0
    rolling_window_trades: 50

###############################################################################
# ALERTING (Phase 4, §12) -- optional, off by default
###############################################################################
alerting:
  enabled: false
  backend: "telegram"
  telegram_bot_token_env_var: "BTC_BOT_TELEGRAM_TOKEN"
  telegram_chat_id_env_var: "BTC_BOT_TELEGRAM_CHAT_ID"
  notify_on: [circuit_breaker_tripped, pending_model_approval, execution_error, daily_summary]

###############################################################################
# STORAGE (Phase 4, §7.4)
###############################################################################
storage:
  registry_db: "data/registry.db"
  system_state_archive: "data/logs/system_state/"
  zone_events: "data/logs/zone_events.parquet"

###############################################################################
# LOGGING
###############################################################################
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
